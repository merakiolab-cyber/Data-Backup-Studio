[workspace]
resolver = "3"
members = ["crates/backup-core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
backup-core = { path = "crates/backup-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "0.0.12"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
globset = { version = "0.4", default-features = false }
jwalk = "0.8"
filetime = "0.2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
